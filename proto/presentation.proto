// A presentation (a song, a passage, a set of notices): its slides, the groups
// they belong to (Verse 1, Chorus…), the orders they're sung in, and details
// such as copyright information.
//
// Only the parts Vessel uses are described; other data in a file is kept
// unchanged when Vessel saves it.

syntax = "proto3";

package vessel.format;

import "common.proto";
import "graphics.proto";

// How a picture or video is adjusted where it's shown (blur, colour…).
// Vessel's own; other apps ignore it. Every value 0 leaves it as it is.
message VesselLook {
  // 0–100.
  double blur = 1;
  double darken = 2;
  // −100 (grey) to 100 (twice as colourful).
  double saturation = 3;
  // −100 to 100.
  double brightness = 4;
  double contrast = 5;
  // Degrees, −180 to 180.
  double hue = 6;
  // −100 (cooler) to 100 (warmer).
  double warmth = 7;
  // 0–100: darker corners.
  double vignette = 8;
}

// One slide: the elements on it, in drawing order (back to front), and its size.
message Slide {
  message Element {
    // Flags; 2 marks a text box.
    enum Info {
      INFO_NONE = 0;
      INFO_IS_TEXT_ELEMENT = 2;
    }
    // When the element comes and goes in a slideshow (PowerPoint's click
    // animations). Vessel's own; other apps ignore it.
    message Build {
      // The click it happens on: 0 as the slide appears, 1 the first click, and so on.
      uint32 step = 1;
      // "appear", "fade", "fly", "float", "wipe" or "zoom".
      string effect = 2;
      // The side it comes in from or goes out to: "left", "right", "top" or "bottom".
      string direction = 3;
      // Seconds after the click, and how long the effect takes.
      double delay = 4;
      double duration = 5;
    }
    // Lines of a text box that come and go on their own (PowerPoint's "by paragraph").
    message LineBuild {
      uint32 first_line = 1;
      uint32 line_count = 2;
      Build build_in = 3;
      Build build_out = 4;
    }
    Graphics.Element element = 1;
    uint32 info = 4;
    Build vessel_build_in = 100;
    Build vessel_build_out = 101;
    repeated LineBuild vessel_line_builds = 102;
    // This slide's own look for a picture on it (else the media bin's look for the file).
    VesselLook vessel_look = 103;
  }
  repeated Element elements = 1;
  bool draws_background_color = 4;
  Color background_color = 5;
  Graphics.Size size = 6;
  UUID uuid = 7;
}

message PresentationSlide {
  // The presenter's notes for the slide (ProPresenter's "Slide Notes").
  message Notes {
    bytes rtf_data = 1;
  }
  Slide base_slide = 1;
  Notes notes = 2;
}

// Something a slide does when it's shown: show its own content, or put media on a layer.
message Action {
  enum ActionType {
    ACTION_TYPE_UNKNOWN = 0;
    ACTION_TYPE_MEDIA = 2;
    ACTION_TYPE_PRESENTATION_SLIDE = 11;
  }
  enum LayerType {
    LAYER_TYPE_BACKGROUND = 0;
    LAYER_TYPE_FOREGROUND = 1;
  }
  message MediaType {
    Media element = 5;
    LayerType layer_type = 10;
    // This slide's own look for its background (else the media bin's look for the file).
    VesselLook vessel_look = 100;
  }
  message SlideType {
    oneof Slide {
      PresentationSlide presentation = 2;
    }
  }
  UUID uuid = 1;
  string name = 2;
  bool isEnabled = 6;
  ActionType type = 9;
  oneof ActionTypeData {
    MediaType media = 20;
    SlideType slide = 23;
  }
}

// A keyboard shortcut; codes 1–26 are the letters A–Z.
message HotKey {
  int32 code = 1;
}

// A named, coloured section of a presentation: "Verse 1", "Chorus"…
message Group {
  UUID uuid = 1;
  string name = 2;
  Color color = 3;
  HotKey hotKey = 4;
}

// A slide in the presentation, with what happens when it's shown and when it moves on.
message Cue {
  // Where a slide's own timer goes when it runs out.
  enum CompletionTargetType {
    COMPLETION_TARGET_TYPE_NONE = 0;
    COMPLETION_TARGET_TYPE_NEXT = 1;
    COMPLETION_TARGET_TYPE_RANDOM = 2;
    COMPLETION_TARGET_TYPE_CUE = 3;
    COMPLETION_TARGET_TYPE_FIRST = 4;
  }
  // What the timer waits for; Vessel uses "after time".
  enum CompletionActionType {
    COMPLETION_ACTION_TYPE_FIRST = 0;
    COMPLETION_ACTION_TYPE_LAST = 1;
    COMPLETION_ACTION_TYPE_AFTER_ACTION = 2;
    COMPLETION_ACTION_TYPE_AFTER_TIME = 3;
  }
  UUID uuid = 1;
  string name = 2;
  CompletionTargetType completion_target_type = 3;
  UUID completion_target_uuid = 4;
  CompletionActionType completion_action_type = 5;
  repeated Action actions = 10;
  bool isEnabled = 12;
  // Seconds, for the slide timer.
  double completion_time = 13;
  // How the slide comes on screen, and how its words come in. Vessel's own.
  message Motion {
    // Transitions: "fade", "push", "slide", "zoom", "blur", "flip", "cube", "wipe", "iris", "cut".
    // Words: "fade", "fade-up", "typewriter", "pop", "bounce", "blur-in", "drop", "rise",
    // "slide-in", "zoom", "zoom-out", "flip", "spin", "glow", "wave", "tracking".
    string effect = 1;
    // Seconds.
    double duration = 2;
    // Words: what comes in on its own: "all", "line", "sentence", "word" or "letter".
    string by = 3;
  }
  Motion vessel_transition = 100;
  Motion vessel_text_motion = 101;
}

message Presentation {
  // Song details for copyright notices and CCLI reports.
  message CCLI {
    string author = 1;
    string artist_credits = 2;
    string song_title = 3;
    string publisher = 4;
    uint32 copyright_year = 5;
    uint32 song_number = 6;
    bool display = 7;
    string album = 8;
    bytes artwork = 9;
  }
  // Marks a presentation as a Bible passage.
  message BibleReference {
    uint32 book_index = 1;
    string book_name = 2;
    IntRange chapter_range = 3;
    IntRange verse_range = 4;
    string translation_name = 5;
    string translation_internal_abbreviation = 7;
  }
  // An order to sing the groups in, e.g. Verse 1, Chorus, Verse 2, Chorus.
  message Arrangement {
    UUID uuid = 1;
    string name = 2;
    repeated UUID group_identifiers = 3;
  }
  // A group and the slides (cues) in it.
  message CueGroup {
    Group group = 1;
    repeated UUID cue_identifiers = 2;
  }
  ApplicationInfo application_info = 1;
  UUID uuid = 2;
  string name = 3;
  string notes = 7;
  UUID selected_arrangement = 10;
  repeated Arrangement arrangements = 11;
  repeated CueGroup cue_groups = 12;
  repeated Cue cues = 13;
  CCLI ccli = 14;
  BibleReference bible_reference = 15;
  // The song's key, as written (original) and as it's played (user), e.g. "G" or "F#m".
  message Music {
    string original_music_key = 1;
    string user_music_key = 2;
    MusicKeyScale original = 3;
    MusicKeyScale user = 4;
  }
  string music_key = 22;
  Music music = 23;
  // Set on a slideshow imported from PowerPoint, Keynote or Google Slides: it's
  // shown as it was made, click by click. Vessel's own; other apps ignore it.
  message Slideshow {
    // Where it came from: "PowerPoint", "Keynote" or "Google Slides".
    string source = 1;
    // Effects shown in their final place, without their motion (spins, motion paths…).
    uint32 still_effects = 2;
  }
  Slideshow vessel_slideshow = 100;
}

// A key: its note, and major or minor.
message MusicKeyScale {
  enum MusicKey {
    MUSIC_KEY_A_FLAT = 0;
    MUSIC_KEY_A = 1;
    MUSIC_KEY_A_SHARP = 2;
    MUSIC_KEY_B_FLAT = 3;
    MUSIC_KEY_B = 4;
    MUSIC_KEY_B_SHARP = 5;
    MUSIC_KEY_C_FLAT = 6;
    MUSIC_KEY_C = 7;
    MUSIC_KEY_C_SHARP = 8;
    MUSIC_KEY_D_FLAT = 9;
    MUSIC_KEY_D = 10;
    MUSIC_KEY_D_SHARP = 11;
    MUSIC_KEY_E_FLAT = 12;
    MUSIC_KEY_E = 13;
    MUSIC_KEY_E_SHARP = 14;
    MUSIC_KEY_F_FLAT = 15;
    MUSIC_KEY_F = 16;
    MUSIC_KEY_F_SHARP = 17;
    MUSIC_KEY_G_FLAT = 18;
    MUSIC_KEY_G = 19;
    MUSIC_KEY_G_SHARP = 20;
  }
  enum MusicScale {
    MUSIC_SCALE_MAJOR = 0;
    MUSIC_SCALE_MINOR = 1;
  }
  MusicKey music_key = 1;
  MusicScale music_scale = 2;
}
